<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EMOS | YEAR GROUP SOCIAL: ONE MORE MEMORY</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root {
  --navy: #0b1428;
  --navy-light: #14213b;
  --black: #080b12;
  --gold: #d5ad55;
  --gold-light: #f0d28b;
  --white: #f5f5f5;
  --muted: #a5adbd;
  --border: #34415a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 28px 16px;
  background:
    radial-gradient(circle at top, #172644 0%, var(--black) 65%);
  color: var(--white);
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.container {
  max-width: 480px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

.logo {
  color: var(--gold);
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 7px;
}

.brand-line {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: 7px;
}

.event-title {
  color: var(--white);
  font-size: 23px;
  line-height: 1.35;
  margin: 24px 0 7px;
}

.subtitle {
  color: var(--gold-light);
  font-size: 13px;
  letter-spacing: 1px;
}

.divider {
  width: 55px;
  height: 2px;
  background: var(--gold);
  margin: 19px auto 0;
}

.panel {
  background: rgba(20, 33, 59, 0.88);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 21px;
  margin-bottom: 17px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}

label {
  display: block;
  color: var(--gold-light);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1.2px;
  margin-bottom: 9px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #46536b;
  background: var(--black);
  color: white;
  font-size: 16px;
  margin-bottom: 19px;
  outline: none;
}

input:focus {
  border-color: var(--gold);
}

input::placeholder {
  color: #778197;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 0.7px;
  cursor: pointer;
  margin-top: 9px;
  transition: opacity 0.2s ease;
}

.primary {
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  color: #101522;
}

.secondary {
  background: #27344c;
  color: white;
  border: 1px solid #46536b;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 10px;
  background: var(--black);
}

#result {
  display: none;
  padding: 17px;
  border-radius: 9px;
  margin-top: 16px;
  line-height: 1.7;
  overflow-wrap: anywhere;
  white-space: pre-line;
  font-size: 14px;
}

.success {
  background: #123b2b;
  color: #a7f0c2;
  border: 1px solid #26724b;
}

.failure {
  background: #451d27;
  color: #ffb9c2;
  border: 1px solid #873b4b;
}

.info {
  color: var(--muted);
  font-size: 11px;
  text-align: center;
  line-height: 1.7;
  margin-top: 22px;
}

.footer-brand {
  color: var(--gold);
  letter-spacing: 2px;
  font-weight: bold;
  margin-top: 8px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">EMOS</div>
  <div class="brand-line">EVENT MANAGEMENT TECHNOLOGY</div>

  <h1 class="event-title">
    YEAR GROUP SOCIAL:<br>
    ONE MORE MEMORY
  </h1>

  <div class="subtitle">A Memory Worth Keeping</div>
  <div class="divider"></div>
</header>

<div class="panel">

  <label for="staffPin">STAFF SECURITY PIN</label>

  <input
    id="staffPin"
    type="password"
    inputmode="numeric"
    maxlength="6"
    placeholder="Enter your 6-digit PIN"
    autocomplete="off"
  >

  <label>LIVE TICKET SCANNER</label>

  <div id="reader"></div>

  <button
    class="primary"
    id="startButton"
    onclick="startScanner()"
  >
    START CAMERA SCANNER
  </button>

  <button
    class="secondary"
    onclick="stopScanner()"
  >
    STOP CAMERA
  </button>

</div>

<div class="panel">

  <label for="manualToken">MANUAL TICKET CHECK</label>

  <input
    id="manualToken"
    type="text"
    placeholder="Enter or paste QR token"
    autocomplete="off"
  >

  <button
    class="primary"
    id="verifyButton"
    onclick="verifyManual()"
  >
    VERIFY TICKET
  </button>

</div>

<div id="result" role="status" aria-live="polite"></div>

<div class="info">
  Authorised event personnel only.<br>
  Secure ticket verification and attendee check-in.

  <div class="footer-brand">POWERED BY EMOS</div>
</div>

</div>

<script>
const API_URL =
  "https://year-group-social-api.vwayne832.workers.dev/";

let scanner = null;
let scanning = false;
let processing = false;

function showResult(message, success) {
  const box = document.getElementById("result");

  box.style.display = "block";
  box.className = success ? "success" : "failure";
  box.textContent = message;
}

async function verifyToken(token) {
  const pin =
    document.getElementById("staffPin").value.trim();

  if (!/^\d{6}$/.test(pin)) {
    showResult(
      "Enter your valid 6-digit staff PIN.",
      false
    );
    return;
  }

  if (!token || processing) return;

  processing = true;

  document.getElementById("verifyButton").disabled = true;

  showResult("Verifying ticket...", true);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "scan",
        token: token.trim(),
        staffPin: pin
      })
    });

    const data = await response.json();

    if (data.success === true) {
      const attendee =
        data.attendeeName ||
        data.name ||
        "Verified attendee";

      const ticket =
        data.ticketId ||
        "Ticket verified";

      showResult(
        "CHECK-IN SUCCESS\n" +
        "YEAR GROUP SOCIAL: ONE MORE MEMORY\n\n" +
        "Attendee: " + attendee +
        "\nTicket: " + ticket,
        true
      );

      document.getElementById("manualToken").value = "";

    } else {
      showResult(
        data.message || "Ticket rejected.",
        false
      );
    }

  } catch (error) {
    showResult(
      "Connection failed. Check your internet connection and try again.",
      false
    );

  } finally {
    processing = false;

    document.getElementById("verifyButton").disabled = false;
  }
}

async function startScanner() {
  const pin =
    document.getElementById("staffPin").value.trim();

  if (!/^\d{6}$/.test(pin)) {
    showResult(
      "Enter your 6-digit staff PIN first.",
      false
    );
    return;
  }

  if (!window.Html5Qrcode) {
    showResult(
      "Scanner library failed to load. Check your internet connection.",
      false
    );
    return;
  }

  if (scanning) return;

  try {
    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      async (decodedText) => {
        if (!processing) {
          await stopScanner();
          await verifyToken(decodedText);
        }
      }
    );

    scanning = true;

    document.getElementById("startButton").disabled = true;

    showResult(
      "Camera ready. Point it at a ticket QR code.",
      true
    );

  } catch (error) {
    showResult(
      "Camera could not start. Allow camera access and try again.",
      false
    );
  }
}

async function stopScanner() {
  if (scanner && scanning) {
    try {
      await scanner.stop();
      scanning = false;

    } catch (error) {
      console.error("Camera stop error:", error);
    }
  }

  document.getElementById("startButton").disabled = false;
}

function verifyManual() {
  const token =
    document.getElementById("manualToken").value.trim();

  if (!token) {
    showResult("Enter a ticket token first.", false);
    return;
  }

  verifyToken(token);
}
</script>

</body>
</html>
